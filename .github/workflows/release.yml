name: Release

# Push a tag like v0.2.0 → build every platform, pack with Velopack (delta against the previous release),
# publish one GitHub Release with release notes generated from the commits since the last tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# one release at a time: each build needs the previous release published to make its delta
concurrency:
  group: release
  cancel-in-progress: false

env:
  VPK_VERSION: 1.2.161 # keep in step with the velopack crate in src-tauri/Cargo.toml
  PACK_ID: PersonalDownloader

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, channel: osx-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, channel: osx-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, channel: win-x64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, channel: linux-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Rust target (toolchain from rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx tauri build --target ${{ matrix.target }} ${{ runner.os == 'macOS' && '--bundles app' || '--no-bundle' }} --config "{\"version\":\"$VERSION\"}"
      - name: Stage pack dir
        run: |
          out=src-tauri/target/${{ matrix.target }}/release
          case "$RUNNER_OS" in
            macOS) pack="$out/bundle/macos/Personal Downloader.app"; exe=personal-downloader; icon=src-tauri/icons/icon.icns ;;
            Windows) exe=personal-downloader.exe; icon=src-tauri/icons/icon.ico ;;
            Linux) exe=personal-downloader; icon=src-tauri/icons/icon.png ;;
          esac
          if [ "$RUNNER_OS" != macOS ]; then
            pack=pack; mkdir -p pack; cp "$out/$exe" pack/
          fi
          { echo "PACK=$pack"; echo "EXE=$exe"; echo "ICON=$icon"; } >> "$GITHUB_ENV"
      # Self-signed, so macOS still warns on first launch, but every release has the same signing identity:
      # permissions like Full Disk Access survive updates (ad-hoc signatures change with every build, and macOS drops them)
      - name: Signing keychain
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"; pw=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          rm "$RUNNER_TEMP/cert.p12"
      - uses: actions/setup-dotnet@v4 # vpk runs on .NET 10
        with:
          dotnet-version: 10.0.x
      - name: Pack with Velopack
        env:
          GH_REPO_URL: https://github.com/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          scripts/changelog.sh "$GITHUB_REF_NAME" "${{ github.repository }}" > notes.md
          # the previous full package is the base for this release's delta; none exists before the first release
          vpk download github --repoUrl "$GH_REPO_URL" --channel ${{ matrix.channel }} --token "$TOKEN" || true
          sign=()
          [ "$RUNNER_OS" = macOS ] && sign=(--signAppIdentity "Personal Downloader" --keychain "$RUNNER_TEMP/sign.keychain-db")
          vpk pack -u "$PACK_ID" -v "$VERSION" -p "$PACK" -e "$EXE" -i "$ICON" --channel ${{ matrix.channel }} \
            --packTitle "Personal Downloader" --releaseNotes notes.md "${sign[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.channel }}
          path: Releases

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: actions/setup-dotnet@v4 # vpk runs on .NET 10
        with:
          dotnet-version: 10.0.x
      - name: Upload to one GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO_URL: https://github.com/${{ github.repository }}
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          for ch in linux-x64 win-x64 osx-arm64 osx-x64; do
            vpk upload github -o "dist/$ch" --channel "$ch" --repoUrl "$GH_REPO_URL" --token "$GH_TOKEN" \
              --publish --merge --tag "$GITHUB_REF_NAME" --releaseName "Personal Downloader ${GITHUB_REF_NAME#v}"
          done
          scripts/changelog.sh "$GITHUB_REF_NAME" "${{ github.repository }}" > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
