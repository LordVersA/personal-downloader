name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check, lint, format (toolchain from rust-toolchain.toml)
        working-directory: src-tauri
        run: |
          rustup component add clippy rustfmt
          cargo fmt --check
          cargo clippy --locked -- -D warnings
      - name: Frontend syntax
        run: node --check src/main.js
      - name: Scripts
        run: bash -n scripts/*.sh
